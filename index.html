<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchoolDesk</title>
<style>
:root{
  --bg:#F7F6F3;--surface:#FFF;--border:#E4E2DC;--text:#1A1917;
  --t2:#6B6860;--t3:#9E9C96;
  --ac:#2D5BE3;--ac-bg:#EEF2FD;--ac-t:#1A3A9F;
  --gr:#1A7F4B;--gr-bg:#E8F7EF;
  --rd:#C0392B;--rd-bg:#FDECEA;
  --am:#A05C00;--am-bg:#FEF3E2;
  --pu:#5B35C5;--pu-bg:#F0ECFD;
  --tl:#0E7490;--tl-bg:#E0F7FA;
  --gy:#6B6860;--gy-bg:#F1EFE8;
  --r:8px;--rl:12px;--sh:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.main{flex:1;overflow-y:auto;padding:28px 32px}
.sb-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.sb-logo .sn{font-size:13px;font-weight:600}
.sb-logo .ss{font-size:11px;color:var(--t3);margin-top:2px}
.sb-user{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.av-d{background:var(--pu-bg);color:var(--pu)}
.av-t{background:var(--gr-bg);color:var(--gr)}
.av-h{background:var(--tl-bg);color:var(--tl)}
.av-p{background:var(--ac-bg);color:var(--ac-t)}
.sb-un{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-ur{font-size:11px;color:var(--t3)}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto}
.ni{display:flex;align-items:center;gap:9px;padding:8px 20px;font-size:13px;color:var(--t2);cursor:pointer;border:none;background:none;width:100%;text-align:left;border-left:2px solid transparent;font-family:inherit}
.ni:hover{background:var(--bg);color:var(--text)}
.ni.active{background:var(--ac-bg);color:var(--ac);font-weight:500;border-left-color:var(--ac)}
.sb-ft{padding:12px 20px;border-top:1px solid var(--border)}
.btn-lo{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.btn-lo:hover{color:var(--rd)}
.ph{margin-bottom:24px}
.pt{font-size:20px;font-weight:600}
.ps{font-size:13px;color:var(--t2);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh)}
.cb{padding:20px 24px}
.card+.card{margin-top:12px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.sv{font-size:28px;font-weight:700;line-height:1}
.sl{font-size:12px;color:var(--t3);margin-top:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;font-weight:500;color:var(--t2)}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:0 10px;height:36px;transition:border-color .12s}
input:focus,select:focus{outline:none;border-color:var(--ac);background:#fff}
input::placeholder{color:var(--t3)}
.fw{width:100%}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:36px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:opacity .12s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-pr{background:var(--ac);color:#fff}
.btn-su{background:var(--gr);color:#fff}
.btn-da{background:var(--rd-bg);color:var(--rd);border-color:#f5c0bb}
.btn-wa{background:var(--am-bg);color:var(--am);border-color:#f5c587}
.btn-tl{background:var(--tl-bg);color:var(--tl);border-color:#b2e0e8}
.btn-gh{background:transparent;color:var(--t2);border-color:var(--border)}
.btn-gh:hover{background:var(--bg)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;background:var(--bg)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF8}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.tgs{background:var(--gr-bg);color:var(--gr)}
.tgr{background:var(--am-bg);color:var(--am)}
.tgi{background:var(--ac-bg);color:var(--ac-t);font-family:monospace;letter-spacing:.04em}
.tgc{background:var(--pu-bg);color:var(--pu)}
.tgx{background:var(--rd-bg);color:var(--rd)}
.tgd{background:var(--gy-bg);color:var(--gy)}
.tgh{background:var(--tl-bg);color:var(--tl)}
.att{width:30px;height:24px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--t3);display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
.att:disabled{cursor:default;opacity:.5}
.att-p{background:var(--gr-bg);color:var(--gr);border-color:#b2e2c8}
.att-a{background:var(--rd-bg);color:var(--rd);border-color:#f5c0bb}
.att-s{background:var(--tl-bg);color:var(--tl);border-color:#b2e0e8}
.gi{width:38px;height:24px;font-size:12px;padding:0;text-align:center;border:1px solid var(--border);border-radius:4px;margin-top:2px;background:var(--bg)}
.gi:disabled{opacity:.5;cursor:default}
.ah{color:var(--gr);font-weight:700}.am2{color:var(--ac);font-weight:600}.al{color:var(--am);font-weight:600}.af{color:var(--rd);font-weight:600}
.gb{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-size:13px;font-weight:700}
.gbh{background:var(--gr-bg);color:var(--gr)}.gbm{background:var(--ac-bg);color:var(--ac-t)}.gbl{background:var(--am-bg);color:var(--am)}.gbf{background:var(--rd-bg);color:var(--rd)}
/* login */
.lp{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.lb{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 40px;width:100%;max-width:380px;box-shadow:var(--sh)}
.lt{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px}
.ls{font-size:13px;color:var(--t3);text-align:center;margin-bottom:28px}
.lf{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.le{font-size:12px;color:var(--rd);text-align:center;min-height:18px;margin-top:8px}
.rt{display:flex;gap:4px;background:var(--bg);border-radius:var(--r);padding:3px;margin-bottom:20px}
.rb{flex:1;padding:6px 4px;font-size:12px;font-weight:500;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--t3);font-family:inherit}
.rb.active{background:var(--surface);color:var(--text);box-shadow:var(--sh)}
/* modal */
.dm{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto}
.dm-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:24px;width:100%;max-width:480px;margin:auto}
.dm-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
/* mobile nav */
.mb-nav{display:none}
@media(max-width:700px){
  .sidebar{display:none}
  .main{padding:16px 16px 80px}
  .sg{grid-template-columns:1fr 1fr}
  .fg{grid-template-columns:1fr}
  .mb-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:50;padding:4px 0 6px}
  .mb-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:10px;font-weight:500;color:var(--t3);background:none;border:none;cursor:pointer;font-family:inherit}
  .mb-nav button.active{color:var(--ac)}
  .mb-ico{font-size:20px;line-height:1}
  .mb-out{position:fixed;top:12px;right:12px;z-index:51;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:6px 12px;font-size:12px;color:var(--t2);cursor:pointer;font-family:inherit}
}
/* util */
.fx{display:flex;align-items:center;gap:8px}
.fw2{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.fb{display:flex;align-items:center;justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.hidden{display:none!important}
.tm{font-size:12px;color:var(--t3)}
.fw5{font-weight:500}
.es{padding:40px;text-align:center;color:var(--t3);font-size:13px}
.dv{border:none;border-top:1px solid var(--border);margin:16px 0}
.sec-lbl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.cd{cursor:pointer;color:var(--t3);font-size:12px;margin-left:2px}
.cd:hover{color:var(--rd)}
.al2{padding:10px 14px;border-radius:var(--r);font-size:13px;margin-top:12px}
.al-s{background:var(--gr-bg);color:var(--gr)}
.al-e{background:var(--rd-bg);color:var(--rd)}
.sp{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(247,246,243,.85);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px;font-size:13px;color:var(--t2)}
.cls-chip{display:inline-flex;align-items:center;gap:4px;background:var(--pu-bg);color:var(--pu);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:500}
.row-off td{opacity:.45}
</style>
</head>
<body>

<div id="ov" class="ov"><div class="sp"></div><span>Завантаження...</span></div>

<!-- LOGIN -->
<div id="pg-login" class="lp hidden">
  <div class="lb">
    <div style="text-align:center;font-size:32px;margin-bottom:8px">🏫</div>
    <div class="lt">SchoolDesk</div>
    <div class="ls">Електронний журнал</div>
    <div class="rt">
      <button class="rb active" onclick="setRole('teacher',this)">Вчитель / Кл. кер.</button>
      <button class="rb" onclick="setRole('parent',this)">Батьки</button>
    </div>
    <div class="lf">
      <div class="f" id="ph-wrap">
        <label>Номер телефону</label>
        <input type="tel" id="li-ph" placeholder="0671234567" class="fw">
      </div>
      <div class="f">
        <label id="li-pl">Пароль</label>
        <input type="password" id="li-ps" placeholder="••••••••" class="fw" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
    </div>
    <button class="btn btn-pr fw" style="width:100%;justify-content:center" id="li-btn" onclick="doLogin()">Увійти →</button>
    <div class="le" id="li-err"></div>
    <div style="margin-top:20px;text-align:center">
      <span style="font-size:11px;color:var(--t3);cursor:pointer;user-select:none" id="adm-lnk">адмін</span>
    </div>
  </div>
</div>

<!-- DIR MODAL -->
<div id="dm-dir" class="dm hidden">
  <div class="dm-box" style="max-width:320px">
    <div class="dm-title">Директор <span style="cursor:pointer;font-size:18px;color:var(--t3)" onclick="closeDm('dm-dir')">✕</span></div>
    <div class="lf">
      <div class="f"><label>Email</label><input type="email" id="de" class="fw" placeholder="director@school.ua"></div>
      <div class="f"><label>Пароль</label><input type="password" id="dp" class="fw" onkeydown="if(event.key==='Enter')doDirLogin()"></div>
    </div>
    <div class="fx">
      <button class="btn btn-gh" style="flex:1;justify-content:center" onclick="closeDm('dm-dir')">Скасувати</button>
      <button class="btn btn-pr" style="flex:1;justify-content:center" onclick="doDirLogin()">Увійти</button>
    </div>
    <div class="le" id="de-err"></div>
  </div>
</div>

<!-- TEACHER DETAIL MODAL -->
<div id="dm-teacher" class="dm hidden">
  <div class="dm-box">
    <div class="dm-title"><span id="dm-t-name">Вчитель</span><span style="cursor:pointer;font-size:18px;color:var(--t3)" onclick="closeDm('dm-teacher')">✕</span></div>
    <div id="dm-t-body"></div>
  </div>
</div>

<!-- APP -->
<div id="pg-app" class="layout hidden">
  <aside class="sidebar">
    <div class="sb-logo"><div class="sn">SchoolDesk</div><div class="ss">Електронний журнал</div></div>
    <div class="sb-user">
      <div class="av" id="sb-av"></div>
      <div style="flex:1;min-width:0"><div class="sb-un" id="sb-nm">—</div><div class="sb-ur" id="sb-rl">—</div></div>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-ft"><button class="btn-lo" onclick="doLogout()">← Вийти</button></div>
  </aside>
  <main class="main" id="mc"></main>
  <div class="mb-nav" id="mb-nav"></div>
  <button class="mb-out hidden" id="mb-out" onclick="doLogout()">Вийти</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, getDocs, query, where }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyB7nX6EqIncKRqjT-uQR2Dlv6zcdQDeOE0",
  authDomain:"schooldesk-d62bf.firebaseapp.com",
  projectId:"schooldesk-d62bf",
  storageBucket:"schooldesk-d62bf.firebasestorage.app",
  messagingSenderId:"265573827724",
  appId:"1:265573827724:web:7a51a1601c5d3823a027a9"
});
const auth=getAuth(app), db=getFirestore(app);

const CLASSES=['1-А','1-Б','2-А','2-Б','3-А','3-Б','4-А','4-Б','5-А','5-Б','6-А','6-Б','7-А','7-Б','8-А','8-Б','9-А','9-Б','10-А','10-Б','11-А','11-Б'];
const SUBJS=['Математика','Алгебра','Геометрія','Українська мова','Українська література','Англійська мова','Фізика','Хімія','Біологія','Географія','Історія України','Всесвітня історія','Інформатика','Фізкультура','Музика','Образотворче мистецтво','Правознавство','Основи здоров\'я','Трудове навчання','Іноземна мова'];
const ATT_CYCLE={null:'p',p:'a',a:'s',s:null};
const ATT_LBL={p:'П',a:'Н',s:'Хв',null:'·'};
const ATT_CLS={p:'att-p',a:'att-a',s:'att-s',null:''};

function uid(){return Math.random().toString(36).slice(2,9).toUpperCase()}
function ini(n){return(n||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'}
function avgG(arr){const g=arr.filter(x=>x>0);return g.length?(g.reduce((a,b)=>a+b,0)/g.length).toFixed(1):null}
function acl(v){if(!v)return'';const n=parseFloat(v);return n>=10?'ah':n>=7?'am2':n>=4?'al':'af'}
function gcl(g){return g>=10?'gbh':g>=7?'gbm':g>=4?'gbl':'gbf'}
function ld(on){document.getElementById('ov').classList.toggle('hidden',!on)}
function err(id,m){const e=document.getElementById(id);if(e)e.textContent=m}
function ph2em(p){return p.replace(/\D/g,'')+'@sd.local'}

let session=null,loginRole='teacher',tmpS=[],tmpC=[],jSt={si:0,cls:'7-А'};

onAuthStateChanged(auth,async user=>{
  if(user){
    try{
      const sn=await getDoc(doc(db,'users',user.uid));
      if(sn.exists()){
        session={role:sn.data().role,uid:user.uid,profile:sn.data()};
        showApp();
      }else{await signOut(auth);showLogin();}
    }catch(e){await signOut(auth);showLogin();}
  }else{showLogin();}
  ld(false);
});

window.setRole=(role,btn)=>{
  loginRole=role;
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const pw=document.getElementById('ph-wrap'),pl=document.getElementById('li-pl');
  if(role==='parent'){
    pw.style.display='none';pl.textContent='ID учня';
    document.getElementById('li-ps').type='text';
    document.getElementById('li-ps').placeholder='напр. AA1111';
  }else{
    pw.style.display='';pl.textContent='Пароль';
    document.getElementById('li-ps').type='password';
    document.getElementById('li-ps').placeholder='••••••••';
  }
};

window.doLogin=async()=>{
  const btn=document.getElementById('li-btn');btn.disabled=true;err('li-err','');
  try{
    if(loginRole==='teacher'){
      const phone=(document.getElementById('li-ph').value||'').trim();
      const pass=(document.getElementById('li-ps').value||'');
      if(!phone||!pass){err('li-err','Введіть телефон і пароль');btn.disabled=false;return;}
      await signInWithEmailAndPassword(auth,ph2em(phone),pass);
    }else{
      const sid=(document.getElementById('li-ps').value||'').trim().toUpperCase();
      if(!sid){err('li-err','Введіть ID учня');btn.disabled=false;return;}
      const q=query(collection(db,'students'),where('sid','==',sid));
      const sn=await getDocs(q);
      if(sn.empty){err('li-err','Учня не знайдено');btn.disabled=false;return;}
      await signInWithEmailAndPassword(auth,sid.toLowerCase()+'@parent.sd',sid);
    }
  }catch(e){
    err('li-err',e.code==='auth/invalid-credential'?'Невірний телефон або пароль':e.message);
    btn.disabled=false;
  }
};

let dblTap=0;
document.getElementById('adm-lnk').addEventListener('click',()=>{
  dblTap++;if(dblTap>=2){dblTap=0;openDm('dm-dir');}setTimeout(()=>dblTap=0,600);
});
function openDm(id){document.getElementById(id).classList.remove('hidden');}
window.closeDm=id=>document.getElementById(id).classList.add('hidden');

window.doDirLogin=async()=>{
  err('de-err','');
  const e2=document.getElementById('de').value.trim();
  const p2=document.getElementById('dp').value;
  try{await signInWithEmailAndPassword(auth,e2,p2);closeDm('dm-dir');}
  catch(e){err('de-err','Невірний email або пароль');}
};

window.doLogout=async()=>{await signOut(auth);session=null;};

function showLogin(){
  document.getElementById('pg-app').classList.add('hidden');
  document.getElementById('pg-login').classList.remove('hidden');
  document.getElementById('li-btn').disabled=false;
}

function showApp(){
  document.getElementById('pg-login').classList.add('hidden');
  document.getElementById('pg-app').classList.remove('hidden');
  buildSb();
  const r=session.role;
  go(r==='director'?'d-stats':r==='homeroom'?'h-class':r==='teacher'?'journal':'p-home');
}

function buildSb(){
  const r=session.role,p=session.profile;
  const av=document.getElementById('sb-av');
  av.textContent=ini(p.name||'');
  av.className='av '+(r==='director'?'av-d':r==='homeroom'?'av-h':r==='teacher'?'av-t':'av-p');
  document.getElementById('sb-nm').textContent=p.name||'—';
  document.getElementById('sb-ur').textContent=r==='director'?'Директор':r==='homeroom'?`Кл. керівник ${p.homeroomClass||''}`:r==='teacher'?'Вчитель':`Клас ${p.classId||''}`;
  let pages=[];
  if(r==='director')pages=[{id:'d-stats',ico:'📊',lbl:'Огляд'},{id:'d-teachers',ico:'👩‍🏫',lbl:'Вчителі'},{id:'d-students',ico:'🎒',lbl:'Учні'}];
  else if(r==='homeroom')pages=[{id:'h-class',ico:'🏠',lbl:'Мій клас'},{id:'journal',ico:'📒',lbl:'Журнал'},{id:'t-profile',ico:'👤',lbl:'Профіль'}];
  else if(r==='teacher')pages=[{id:'journal',ico:'📒',lbl:'Журнал'},{id:'t-profile',ico:'👤',lbl:'Профіль'}];

window.saveTeacher=async()=>{

  if(pass.length<6){msg.innerHTML='<div class="al2 al-e">Пароль мінімум 6 символів</div>';return;}
  if(!tmpS.length){msg.innerHTML='<div class="al2 al-e">Додайте хоча б один предмет</div>';return;}
  btn.disabled=true;
  try{
    const tid=uid();
    const email=ph2em(phone);

    await setDoc(doc(db,'teachers',tid),{name,phone,email,pass,rate,subjects:[...tmpS],classes:[...tmpC],homeroomClass,active:true});

};

async function tJournal(mc){
  const p=session.profile;
  const tid=p.teacherId||session.uid;
  const tdoc=await getDoc(doc(db,'teachers',tid));
  const teacher=tdoc.exists()?tdoc.data():p;
  const isActive=teacher.active!==false;
  const subjs=teacher.subjects||[];
  const allowedCls=teacher.classes&&teacher.classes.length?teacher.classes:CLASSES;

  if(!subjs.length){mc.innerHTML='<div class="ph"><h1 class="pt">Журнал</h1></div><div class="card"><div class="es">Немає предметів</div></div>';return;}
  if(!allowedCls.includes(jSt.cls))jSt.cls=allowedCls[0];

  const students=(await getDocs(query(collection(db,'students'),where('classId','==',jSt.cls)))).docs
    .map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
  const curS=subjs[jSt.si];
  const lSnap=await getDocs(query(collection(db,'lessons'),
    where('teacherId','==',tid),where('classId','==',jSt.cls),where('subjectId','==',curS.id)));
  const lessons=lSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.num-b.num);

  const sOpts=subjs.map((s,i)=>`<option value="${i}" ${i===jSt.si?'selected':''}>${s.name}</option>`).join('');
  const cOpts=allowedCls.map(c=>`<option ${c===jSt.cls?'selected':''}>${c}</option>`).join('');

  let tbl='';
  if(!students.length)tbl='<div class="es">У цьому класі ще немає учнів</div>';
  else if(!lessons.length)tbl='<div class="es">Немає уроків. Натисніть «+ Урок»</div>';
  else tbl=`<div style="overflow-x:auto"><table>
    <thead><tr>
      <th style="min-width:180px">Учень</th>
      ${lessons.map(l=>`<th style="text-align:center;min-width:54px">№${l.num}<br><span style="font-size:10px;font-weight:400;color:var(--t3)">${(l.date||'').slice(5)}</span></th>`).join('')}
      <th style="text-align:center">Сер.</th>
    </tr></thead><tbody>
    ${students.map(s=>{
      const grades=[];
      const cells=lessons.map(l=>{
        const e=(l.entries||[]).find(x=>x.studentId===s.id);
        const att=e?e.att:null,grade=e?e.grade||0:0;
        if(grade>0)grades.push(grade);
        return `<td style="text-align:center">
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
            <button class="att ${ATT_CLS[att]||''}" ${!isActive?'disabled':''} onclick="cycleAtt('${l.id}','${s.id}')">${ATT_LBL[att]||'·'}</button>
            <input class="gi" type="number" min="1" max="12" value="${grade>0?grade:''}" placeholder="—" ${!isActive?'disabled':''} onchange="setGrade(this,'${l.id}','${s.id}')">
          </div>
        </td>`;
      }).join('');
      const a=avgG(grades);
      return `<tr><td><div class="fx" style="gap:6px"><div class="av av-p" style="width:24px;height:24px;font-size:10px">${ini(s.name)}</div><span class="fw5">${s.name}</span></div></td>${cells}<td style="text-align:center">${a?`<span class="${acl(a)}" style="font-size:14px">${a}</span>`:'—'}</td></tr>`;
    }).join('')}
    </tbody></table></div>`;

  mc.innerHTML=`
    <div class="ph"><h1 class="pt">Журнал</h1>
      <p class="ps">${teacher.name||''}${!isActive?' &nbsp;<span class="tag tgx">Деактивовано — тільки перегляд</span>':''}</p>
    </div>
    <div class="card cb mb12">
      <div class="fw2" style="gap:12px">
        <div class="f"><label>Предмет</label><select onchange="jSt.si=parseInt(this.value);go('journal')">${sOpts}</select></div>
        <div class="f"><label>Клас</label><select onchange="jSt.cls=this.value;go('journal')">${cOpts}</select></div>
        ${isActive?`<div style="margin-top:auto"><button class="btn btn-su" onclick="addLesson()">+ Урок</button></div>`:''}
      </div>
    </div>
    <div class="card">${tbl}</div>`;
}

window.addLesson=async()=>{
  const p=session.profile,tid=p.teacherId||session.uid;
  const td=await getDoc(doc(db,'teachers',tid));
  if(td.data().active===false)return;
  const curS=td.data().subjects[jSt.si];
  const ex=await getDocs(query(collection(db,'lessons'),where('teacherId','==',tid),where('classId','==',jSt.cls),where('subjectId','==',curS.id)));
  await setDoc(doc(db,'lessons',uid()),{num:ex.size+1,date:new Date().toISOString().slice(0,10),teacherId:tid,classId:jSt.cls,subjectId:curS.id,entries:[]});
  go('journal');
};

async function ensureEntry(lid,sid){
  const lr=doc(db,'lessons',lid),ls=await getDoc(lr),d=ls.data(),entries=d.entries||[];
  let e=entries.find(x=>x.studentId===sid);
  if(!e){e={studentId:sid,att:null,grade:0};entries.push(e);}
  return{lr,entries,e};
}
window.cycleAtt=async(lid,sid)=>{const{lr,entries,e}=await ensureEntry(lid,sid);e.att=ATT_CYCLE[e.att===undefined?'null':e.att]??null;await updateDoc(lr,{entries});go('journal');};
window.setGrade=async(inp,lid,sid)=>{const v=parseInt(inp.value),grade=(v>=1&&v<=12)?v:0;if(!grade)inp.value='';const{lr,entries,e}=await ensureEntry(lid,sid);e.grade=grade;await updateDoc(lr,{entries});go('journal');};

  const p=session.profile,tid=p.teacherId||session.uid;
  const td=await getDoc(doc(db,'teachers',tid));
  const t=td.data()||p;
  mc.innerHTML=`<div class="ph"><h1 class="pt">Мій профіль</h1></div>
  <div class="card cb">
    <div class="fx mb16">
      <div class="av av-t" style="width:48px;height:48px;font-size:16px">${ini(t.name)}</div>
      <div style="margin-left:12px">
        <div style="font-size:16px;font-weight:600">${t.name}</div>
        <div class="tm">${t.phone||'—'} · <span class="tag tgr">${t.rate} ставки</span> · <span class="tag ${t.active===false?'tgx':'tgs'}">${t.active===false?'Деактивовано':'Активний'}</span></div>
        ${t.homeroomClass?`<div class="mt8"><span class="tag tgh">Класний керівник: ${t.homeroomClass}</span></div>`:''}
      </div>
    </div>
    <hr class="dv">
    <div class="sec-lbl">Предмети</div>
    <div class="fw2 mb12">${(t.subjects||[]).map(s=>`<span class="tag tgs">${s.name}</span>`).join('')||'<span class="tm">Немає</span>'}</div>
    <div class="sec-lbl">Класи</div>
    <div class="fw2">${(t.classes||[]).map(c=>`<span class="cls-chip">${c}</span>`).join('')||'<span class="tm">Всі</span>'}</div>
  </div>`;
}

// ════════════════ PARENT ════════════════
async function getSD(sid,classId){
  const ts=await getDocs(collection(db,'teachers'));
  const res=[];
  for(const td of ts.docs){
    const t=td.data();
    for(const subj of(t.subjects||[])){
      const ls=await getDocs(query(collection(db,'lessons'),where('teacherId','==',td.id),where('classId','==',classId),where('subjectId','==',subj.id)));
      if(ls.empty)continue;
      const rows=ls.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.num-b.num)
        .map(l=>{const e=(l.entries||[]).find(x=>x.studentId===sid);return{num:l.num,date:l.date,att:e?e.att:null,grade:e?e.grade||0:0};});
      const grades=rows.map(r=>r.grade).filter(g=>g>0);
      res.push({tName:t.name,sName:subj.name,rows,avg:avgG(grades)});
    }
  }
  return res;
}

async function pHome(mc){
  const p=session.profile;
  const ss=await getDocs(query(collection(db,'students'),where('sid','==',p.sid)));
  if(ss.empty){mc.innerHTML='<div class="es">Учня не знайдено</div>';return;}
  const st={id:ss.docs[0].id,...ss.docs[0].data()};
  const subjects=await getSD(st.id,st.classId);
  mc.innerHTML=`<div class="ph"><h1 class="pt">Успішність</h1><p class="ps">${st.name} · Клас ${st.classId} · ID: <span class="tag tgi">${st.sid}</span></p></div>`;
  if(!subjects.length){mc.innerHTML+='<div class="card"><div class="es">Журнал ще не заповнений</div></div>';return;}
  subjects.forEach(subj=>{
    const gr=subj.rows.filter(r=>r.grade>0);
    mc.innerHTML+=`<div class="card cb mb12">
      <div class="fb mb12"><div><span style="font-size:15px;font-weight:600">${subj.sName}</span><span class="tm" style="margin-left:8px">${subj.tName}</span></div>${subj.avg?`<span class="${acl(subj.avg)}" style="font-size:20px;font-weight:700">${subj.avg}</span>`:''}</div>
      <div class="fw2">${gr.map(r=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="tm" style="font-size:10px">№${r.num}</span><span class="gb ${gcl(r.grade)}">${r.grade}</span></div>`).join('')||'<span class="tm">Оцінок ще немає</span>'}</div>
    </div>`;
  });
}

async function pAtt(mc){
  const p=session.profile;
  const ss=await getDocs(query(collection(db,'students'),where('sid','==',p.sid)));
  if(ss.empty){mc.innerHTML='<div class="es">Учня не знайдено</div>';return;}
  const st={id:ss.docs[0].id,...ss.docs[0].data()};
  const subjects=await getSD(st.id,st.classId);
  mc.innerHTML=`<div class="ph"><h1 class="pt">Відвідуваність</h1><p class="ps">${st.name} · Клас ${st.classId}</p></div>`;
  if(!subjects.length){mc.innerHTML+='<div class="card"><div class="es">Даних ще немає</div></div>';return;}
  subjects.forEach(subj=>{
    const tot=subj.rows.length,pr=subj.rows.filter(r=>r.att==='p').length,ab=subj.rows.filter(r=>r.att==='a').length,sk=subj.rows.filter(r=>r.att==='s').length;
    const pct=tot>0?Math.round(pr/tot*100):null;
    mc.innerHTML+=`<div class="card cb mb12">
      <div class="fb mb10"><span style="font-size:15px;font-weight:600">${subj.sName}</span>
        <div class="fx" style="gap:6px">
          ${pct!==null?`<span class="tag ${pct>=75?'tgs':'tgr'}">${pct}%</span>`:''}
          ${ab?`<span class="tag tgx">Н: ${ab}</span>`:''}
          ${sk?`<span class="tag tgh">Хв: ${sk}</span>`:''}
        </div>
      </div>
      <div class="fw2">${subj.rows.map(r=>{
        const bg=r.att==='p'?'var(--gr-bg)':r.att==='a'?'var(--rd-bg)':r.att==='s'?'var(--tl-bg)':'var(--bg)';
        const cl=r.att==='p'?'var(--gr)':r.att==='a'?'var(--rd)':r.att==='s'?'var(--tl)':'var(--t3)';
        return `<div style="display:inline-flex;align-items:center;gap:4px;background:${bg};border:1px solid ${cl};color:${cl};border-radius:6px;padding:3px 8px;font-size:12px">
          ${ATT_LBL[r.att]||'·'} №${r.num} <span style="color:var(--t3);font-size:10px">${(r.date||'').slice(5)}</span>
        </div>`;
      }).join('')}</div>
    </div>`;
  });
}
