<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchoolDesk</title>
<style>
:root {
  --bg: #F7F6F3; --surface: #FFF; --border: #E4E2DC; --text: #1A1917;
  --text-2: #6B6860; --text-3: #9E9C96;
  --accent: #2D5BE3; --accent-bg: #EEF2FD; --accent-t: #1A3A9F;
  --green: #1A7F4B; --green-bg: #E8F7EF;
  --red: #C0392B; --red-bg: #FDECEA;
  --amber: #A05C00; --amber-bg: #FEF3E2;
  --purple: #5B35C5; --purple-bg: #F0ECFD;
  --teal: #0E7490; --teal-bg: #E0F7FA;
  --gray: #6B6860; --gray-bg: #F1EFE8;
  --r: 8px; --rl: 12px; --sh: 0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.main{flex:1;overflow-y:auto;padding:28px 32px}
.sb-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.sb-logo .sn{font-size:13px;font-weight:600}
.sb-logo .ss{font-size:11px;color:var(--text-3);margin-top:2px}
.sb-user{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.av-d{background:var(--purple-bg);color:var(--purple)}
.av-t{background:var(--green-bg);color:var(--green)}
.av-p{background:var(--accent-bg);color:var(--accent-t)}
.sb-uname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-urole{font-size:11px;color:var(--text-3)}
.sb-nav{flex:1;padding:8px 0;overflow-y:auto}
.ni{display:flex;align-items:center;gap:9px;padding:8px 20px;font-size:13px;color:var(--text-2);cursor:pointer;border:none;background:none;width:100%;text-align:left;border-left:2px solid transparent;font-family:inherit}
.ni:hover{background:var(--bg);color:var(--text)}
.ni.active{background:var(--accent-bg);color:var(--accent);font-weight:500;border-left-color:var(--accent)}
.sb-foot{padding:12px 20px;border-top:1px solid var(--border)}
.btn-lo{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.btn-lo:hover{color:var(--red)}
.ph{margin-bottom:24px}
.pt{font-size:20px;font-weight:600}
.ps{font-size:13px;color:var(--text-2);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh)}
.cb{padding:20px 24px}
.card+.card{margin-top:12px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.sv{font-size:28px;font-weight:700;line-height:1}
.sl{font-size:12px;color:var(--text-3);margin-top:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;font-weight:500;color:var(--text-2)}
input,select{font-family:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:0 10px;height:36px;transition:border-color .12s}
input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
input::placeholder{color:var(--text-3)}
.fw{width:100%}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:36px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:opacity .12s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-pr{background:var(--accent);color:#fff}
.btn-su{background:var(--green);color:#fff}
.btn-da{background:var(--red-bg);color:var(--red);border-color:#f5c0bb}
.btn-wa{background:var(--amber-bg);color:var(--amber);border-color:#f5c587}
.btn-gh{background:transparent;color:var(--text-2);border-color:var(--border)}
.btn-gh:hover{background:var(--bg)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;background:var(--bg)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF8}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.tgs{background:var(--green-bg);color:var(--green)}
.tgr{background:var(--amber-bg);color:var(--amber)}
.tgi{background:var(--accent-bg);color:var(--accent-t);font-family:monospace;letter-spacing:.04em}
.tgc{background:var(--purple-bg);color:var(--purple)}
.tgx{background:var(--red-bg);color:var(--red)}
.tgd{background:var(--gray-bg);color:var(--gray)}
/* attendance buttons */
.att{width:30px;height:24px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;font-family:inherit;transition:background .1s}
.att:disabled{cursor:default;opacity:.5}
.att-p{background:var(--green-bg);color:var(--green);border-color:#b2e2c8}
.att-a{background:var(--red-bg);color:var(--red);border-color:#f5c0bb}
.att-s{background:var(--teal-bg);color:var(--teal);border-color:#b2e0e8}
.gi{width:38px;height:24px;font-size:12px;padding:0;text-align:center;border:1px solid var(--border);border-radius:4px;margin-top:2px;background:var(--bg)}
.gi:disabled{opacity:.5;cursor:default}
.ah{color:var(--green);font-weight:700}
.am{color:var(--accent);font-weight:600}
.al{color:var(--amber);font-weight:600}
.af{color:var(--red);font-weight:600}
.gb{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-size:13px;font-weight:700}
.gbh{background:var(--green-bg);color:var(--green)}
.gbm{background:var(--accent-bg);color:var(--accent-t)}
.gbl{background:var(--amber-bg);color:var(--amber)}
.gbf{background:var(--red-bg);color:var(--red)}
.lp{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.lb{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 40px;width:100%;max-width:380px;box-shadow:var(--sh)}
.ll{text-align:center;margin-bottom:8px;font-size:32px}
.lt{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px}
.ls{font-size:13px;color:var(--text-3);text-align:center;margin-bottom:28px}
.lf{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.le{font-size:12px;color:var(--red);text-align:center;min-height:18px;margin-top:8px}
.rt{display:flex;gap:4px;background:var(--bg);border-radius:var(--r);padding:3px;margin-bottom:20px}
.rb{flex:1;padding:6px 4px;font-size:12px;font-weight:500;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--text-3);transition:all .12s;font-family:inherit}
.rb.active{background:var(--surface);color:var(--text);box-shadow:var(--sh)}
.lc{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px}
.fx{display:flex;align-items:center;gap:8px}
.fw2{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.fb{display:flex;align-items:center;justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.hidden{display:none!important}
.tm{font-size:12px;color:var(--text-3)}
.fw5{font-weight:500}
.es{padding:40px;text-align:center;color:var(--text-3);font-size:13px}
.dv{border:none;border-top:1px solid var(--border);margin:16px 0}
.sl-{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.cd{cursor:pointer;color:var(--text-3);font-size:12px;margin-left:2px}
.cd:hover{color:var(--red)}
.al2{padding:10px 14px;border-radius:var(--r);font-size:13px;margin-top:12px}
.al-s{background:var(--green-bg);color:var(--green)}
.al-e{background:var(--red-bg);color:var(--red)}
.sp{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(247,246,243,.85);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px;font-size:13px;color:var(--text-2)}
.dm{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center}
/* deactivated row */
.row-inactive td{opacity:.5}
.row-inactive td:first-child::after{content:'деактивовано';display:block;font-size:10px;color:var(--red);font-weight:500}
@media(max-width:700px){.sidebar{display:none}.main{padding:16px 16px 80px}.sg{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr}}
.mb-nav{display:none}
@media(max-width:700px){.mb-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:50;padding:4px 0 6px}
.mb-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:10px;font-weight:500;color:var(--text-3);background:none;border:none;cursor:pointer;font-family:inherit}
.mb-nav button.active{color:var(--accent)}
.mb-nav .mb-ico{font-size:20px;line-height:1}
.mb-logout{position:fixed;top:12px;right:12px;z-index:51;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:6px 12px;font-size:12px;color:var(--text-2);cursor:pointer;font-family:inherit}}
</style>
</head>
<body>

<div id="ov" class="ov"><div class="sp"></div><span>Завантаження...</span></div>

<div id="pg-login" class="lp hidden">
  <div class="lb">
    <div class="ll">🏫</div>
    <div class="lt">SchoolDesk</div>
    <div class="ls">Електронний журнал</div>
    <div class="rt">
      <button class="rb active" onclick="setRole('teacher',this)">Вчитель</button>
      <button class="rb" onclick="setRole('parent',this)">Батьки</button>
    </div>
    <div class="lf">
      <div class="f" id="phone-wrap">
        <label>Номер телефону</label>
        <input type="tel" id="li-phone" placeholder="0671234567" pattern="[0-9]{10}" class="fw">
      </div>
      <div class="f">
        <label id="li-pl">Пароль</label>
        <input type="password" id="li-pass" placeholder="••••••••" class="fw" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
    </div>
    <button class="btn btn-pr fw" style="width:100%;justify-content:center" id="li-btn" onclick="doLogin()">Увійти →</button>
    <div class="le" id="li-err"></div>
    <div style="margin-top:20px;text-align:center">
      <span style="font-size:11px;color:var(--text-3);cursor:pointer;user-select:none" id="adm-lnk">адмін</span>
    </div>
  </div>
</div>

<div id="dm-dir" class="dm hidden">
  <div class="lb" style="max-width:320px">
    <div class="lt" style="font-size:16px;margin-bottom:16px">Вхід директора</div>
    <div class="lf">
      <div class="f"><label>Email</label><input type="email" id="de" class="fw" placeholder="director@school.ua"></div>
      <div class="f"><label>Пароль</label><input type="password" id="dp" class="fw" onkeydown="if(event.key==='Enter')doDirLogin()"></div>
    </div>
    <div class="fx" style="gap:8px">
      <button class="btn btn-gh" style="flex:1;justify-content:center" onclick="closeDm()">Скасувати</button>
      <button class="btn btn-pr" style="flex:1;justify-content:center" onclick="doDirLogin()">Увійти</button>
    </div>
    <div class="le" id="de-err"></div>
  </div>
</div>

<div id="pg-app" class="layout hidden">
<div class="mb-nav" id="mb-nav"></div>
<button class="mb-logout hidden" id="mb-logout-btn" onclick="doLogout()">Вийти</button>
  <aside class="sidebar">
    <div class="sb-logo"><div class="sn">SchoolDesk</div><div class="ss">Електронний журнал</div></div>
    <div class="sb-user">
      <div class="av" id="sb-av"></div>
      <div style="flex:1;min-width:0">
        <div class="sb-uname" id="sb-nm">—</div>
        <div class="sb-urole" id="sb-rl">—</div>
      </div>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot"><button class="btn-lo" onclick="doLogout()">← Вийти</button></div>
  </aside>
  <main class="main" id="mc"></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, getDocs, query, where }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyB7nX6EqIncKRqjT-uQR2Dlv6zcdQDeOE0",
  authDomain:"schooldesk-d62bf.firebaseapp.com",
  projectId:"schooldesk-d62bf",
  storageBucket:"schooldesk-d62bf.firebasestorage.app",
  messagingSenderId:"265573827724",
  appId:"1:265573827724:web:7a51a1601c5d3823a027a9"
});
const auth = getAuth(app);
const db   = getFirestore(app);

const CLASSES=['1-А','1-Б','2-А','2-Б','3-А','3-Б','4-А','4-Б','5-А','5-Б','6-А','6-Б','7-А','7-Б','8-А','8-Б','9-А','9-Б','10-А','10-Б','11-А','11-Б'];
const SUBJS=['Математика','Алгебра','Геометрія','Українська мова','Українська література','Англійська мова','Фізика','Хімія','Біологія','Географія','Історія України','Всесвітня історія','Інформатика','Фізкультура','Музика','Образотворче мистецтво','Правознавство'];

// attendance cycle: null → p → a → s → null
const ATT_CYCLE = {null:'p', p:'a', a:'s', s:null};
const ATT_LABEL = {p:'П', a:'Н', s:'Хв', null:'·'};
const ATT_CLS   = {p:'att-p', a:'att-a', s:'att-s', null:''};

function uid(){ return Math.random().toString(36).slice(2,9).toUpperCase(); }
function ini(n){ return (n||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'; }
function avg(arr){ const g=arr.filter(x=>x>0); return g.length?(g.reduce((a,b)=>a+b,0)/g.length).toFixed(1):null; }
function acl(v){ if(!v)return''; const n=parseFloat(v); return n>=10?'ah':n>=7?'am':n>=4?'al':'af'; }
function gcl(g){ return g>=10?'gbh':g>=7?'gbm':g>=4?'gbl':'gbf'; }
function ld(on){ document.getElementById('ov').classList.toggle('hidden',!on); }
function err(id,m){ document.getElementById(id).textContent=m; }
function phoneToEmail(p){ return p.replace(/\D/g,'')+'@sd.local'; }

let session=null, loginRole='teacher', tmpS=[], jSt={si:0,cls:'7-А'};

onAuthStateChanged(auth, async user=>{
  if(user){
    try{
      const sn=await getDoc(doc(db,'users',user.uid));
      if(sn.exists()){
        session={role:sn.data().role, uid:user.uid, profile:sn.data()};
        showApp();
      } else {
    buildMbNav([
      {id:"p-home",ico:"📊",lbl:"Оцінки"},
      {id:"p-att",ico:"✅",lbl:"Відвідуваність"}
    ]); await signOut(auth); showLogin(); }
    }catch(e){ await signOut(auth); showLogin(); }
  } else {
    buildMbNav([
      {id:"p-home",ico:"📊",lbl:"Оцінки"},
      {id:"p-att",ico:"✅",lbl:"Відвідуваність"}
    ]); showLogin(); }
  ld(false);
});

// ── login ──
window.setRole=(role,btn)=>{
  loginRole=role;
  document.querySelectorAll('.rb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const pw=document.getElementById('phone-wrap');
  const pl=document.getElementById('li-pl');
  if(role==='parent'){
    pw.style.display='none';
    pl.textContent='ID учня';
    document.getElementById('li-pass').type='text';
    document.getElementById('li-pass').placeholder='напр. AA1111';
  } else {
    buildMbNav([
      {id:"p-home",ico:"📊",lbl:"Оцінки"},
      {id:"p-att",ico:"✅",lbl:"Відвідуваність"}
    ]);
    pw.style.display='';
    pl.textContent='Пароль';
    document.getElementById('li-pass').type='password';
    document.getElementById('li-pass').placeholder='••••••••';
  }
};

window.doLogin=async()=>{
  const btn=document.getElementById('li-btn');
  btn.disabled=true; err('li-err','');
  try{
    if(loginRole==='teacher'){
      const phone=(document.getElementById('li-phone').value||'').trim();
      const pass=(document.getElementById('li-pass').value||'');
      if(!phone||!pass){err('li-err','Введіть телефон і пароль');btn.disabled=false;return;}
      const email=phoneToEmail(phone);
      await signInWithEmailAndPassword(auth,email,pass);
    } else {
    buildMbNav([
      {id:"p-home",ico:"📊",lbl:"Оцінки"},
      {id:"p-att",ico:"✅",lbl:"Відвідуваність"}
    ]);
      const sid=(document.getElementById('li-pass').value||'').trim().toUpperCase();
      if(!sid){err('li-err','Введіть ID учня');btn.disabled=false;return;}
      const q=query(collection(db,'students'),where('sid','==',sid));
      const sn=await getDocs(q);
      if(sn.empty){err('li-err','Учня не знайдено');btn.disabled=false;return;}
      await signInWithEmailAndPassword(auth,sid.toLowerCase()+'@parent.sd',sid);
    }
  }catch(e){
    err('li-err',e.code==='auth/invalid-credential'?'Невірний телефон або пароль':e.message);
    btn.disabled=false;
  }
};

// dir modal
let dblTap=0;
document.getElementById('adm-lnk').addEventListener('click',()=>{
  dblTap++; if(dblTap>=2){dblTap=0;openDm();} setTimeout(()=>dblTap=0,600);
});
function openDm(){ document.getElementById('dm-dir').classList.remove('hidden'); }
window.closeDm=()=>{ document.getElementById('dm-dir').classList.add('hidden'); };
window.doDirLogin=async()=>{
  const e2=document.getElementById('de').value.trim();
  const p2=document.getElementById('dp').value;
  err('de-err','');
  try{ await signInWithEmailAndPassword(auth,e2,p2); closeDm(); }
  catch(e){ err('de-err','Невірний email або пароль'); }
};

window.doLogout=async()=>{ await signOut(auth); session=null; };

function showLogin(){
  document.getElementById('pg-app').classList.add('hidden');
  document.getElementById('pg-login').classList.remove('hidden');
  document.getElementById('li-btn').disabled=false;
}

// ── app shell ──
function showApp(){
  document.getElementById('pg-login').classList.add('hidden');
  document.getElementById('pg-app').classList.remove('hidden');
  buildSb();
  const r=session.role;
  go(r==='director'?'d-stats':r==='teacher'?'journal':'p-home');
}

function buildMbNav(pages){
  const mn=document.getElementById("mb-nav");
  const ml=document.getElementById("mb-logout-btn");
  if(!mn)return;
  mn.innerHTML=pages.map(p=>`<button data-p="${p.id}" onclick="go('${p.id}')">
    <span class="mb-ico">${p.ico}</span><span>${p.lbl}</span>
  </button>`).join("");
  ml.classList.remove("hidden");
}

function buildSb(){
  const r=session.role, p=session.profile;
  const av=document.getElementById('sb-av');
  av.textContent=ini(p.name||p.phone||p.email||'');
  av.className='av '+(r==='director'?'av-d':r==='teacher'?'av-t':'av-p');
  document.getElementById('sb-nm').textContent=p.name||p.phone||p.email||'—';
  document.getElementById('sb-rl').textContent=r==='director'?'Директор':r==='teacher'?'Вчитель':`Клас ${p.classId||''}`;
  const nav=document.getElementById('sb-nav');
  if(r==="director"){
    buildMbNav([
      {id:"d-stats",ico:"📊",lbl:"Огляд"},
      {id:"d-teachers",ico:"👩200d🏫",lbl:"Вчителі"},

window.saveTeacher=async()=>{
  const name=document.getElementById('tn').value.trim();

  const rate=parseFloat(document.getElementById('tr').value);

  if(!name||!phone||!pass){msg.innerHTML='<div class="al2 al-e">Заповніть ПІБ, телефон і пароль</div>';return;}
  if(pass.length<6){msg.innerHTML='<div class="al2 al-e">Пароль мінімум 6 символів</div>';return;}
  if(!tmpS.length){msg.innerHTML='<div class="al2 al-e">Додайте хоча б один предмет</div>';return;}
  btn.disabled=true;
  try{
    const tid=uid();
    const email=phoneToEmail(phone);
    await setDoc(doc(db,'teachers',tid),{name,phone,email,pass,rate,subjects:[...tmpS],active:true});
    await setDoc(doc(db,'users',tid),{role:'teacher',name,phone,email,teacherId:tid,active:true});

  }
};

    tbl=`<div style="overflow-x:auto"><table class="jnl">
      <thead><tr>

        const grades=[];

  const p=session.profile, tid=p.teacherId||session.uid;

  const curS=td.data().subjects[jSt.si];

    where('teacherId','==',tid),where('classId','==',jSt.cls),where('subjectId','==',curS.id)));
  const num=ex.size+1;
  await setDoc(doc(db,'lessons',uid()),{
    num,date:new Date().toISOString().slice(0,10),
    teacherId:tid,classId:jSt.cls,subjectId:curS.id,entries:[]
  });

async function ensureEntry(lid,sid){
  const lr=doc(db,'lessons',lid);
  const ls=await getDoc(lr);
  const d=ls.data();
  const entries=d.entries||[];
  let e=entries.find(x=>x.studentId===sid);
  if(!e){e={studentId:sid,att:null,grade:0};entries.push(e);}
  return {lr,entries,e};
}

window.cycleAtt=async(lid,sid)=>{
  const {lr,entries,e}=await ensureEntry(lid,sid);
  e.att=ATT_CYCLE[e.att===undefined?'null':e.att]??null;
  await updateDoc(lr,{entries});
  go('journal');
};

window.setGrade=async(inp,lid,sid)=>{
  const v=parseInt(inp.value);
  const grade=(v>=1&&v<=12)?v:0;
  if(!grade)inp.value='';
  const {lr,entries,e}=await ensureEntry(lid,sid);
  e.grade=grade;
  await updateDoc(lr,{entries});
  go('journal');
};

// ════════════════════════════════
async function getSD(sid,classId){
  const ts=await getDocs(collection(db,'teachers'));
  const res=[];
  for(const td of ts.docs){
    const t=td.data();
    for(const subj of (t.subjects||[])){
      const ls=await getDocs(query(collection(db,'lessons'),
        where('teacherId','==',td.id),where('classId','==',classId),where('subjectId','==',subj.id)));
      if(ls.empty)continue;
      const rows=ls.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.num-b.num)
        .map(l=>{const e=(l.entries||[]).find(x=>x.studentId===sid);
          return{num:l.num,date:l.date,att:e?e.att:null,grade:e?e.grade||0:0};});
      const grades=rows.map(r=>r.grade).filter(g=>g>0);
      res.push({tName:t.name,sName:subj.name,rows,avg:avg(grades)});
    }
  }
  return res;
}

        <span style="font-size:15px;font-weight:600">${subj.sName}</span>
        <div class="fx" style="gap:6px">
          ${pct!==null?`<span class="tag ${pct>=75?'tgs':'tgr'}">${pct}% присутності</span>`:''}
          ${ab?`<span class="tag tgx">Н: ${ab}</span>`:''}
          ${sk?`<span class="tag" style="background:var(--teal-bg);color:var(--teal)">Хв: ${sk}</span>`:''}
        </div>
      </div>
      <div class="fw2">
        ${subj.rows.map(r=>{
          const lbl=ATT_LABEL[r.att]||'·';
          const bg=r.att==='p'?'var(--green-bg)':r.att==='a'?'var(--red-bg)':r.att==='s'?'var(--teal-bg)':'var(--bg)';
          const cl=r.att==='p'?'var(--green)':r.att==='a'?'var(--red)':r.att==='s'?'var(--teal)':'var(--text-3)';
          return `<div class="lc" style="background:${bg};border-color:${cl};color:${cl}">
            ${lbl} №${r.num} <span style="color:var(--text-3);font-size:10px">${(r.date||'').slice(5)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
}

// expose helpers to inline handlers
['go','setRole','doLogin','doLogout','closeDm','doDirLogin',
 'addTS','removeTS','saveTeacher','toggleTeacher','delTeacher',
 'saveStudent','delStudent','addLesson','cycleAtt','setGrade']
.forEach(fn=>window[fn]=window[fn]);

</script>
